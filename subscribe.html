<body class="signup-page">

  <main class="signup-main">
    <img src="images/logo_text.png" alt="Klez Fest Midwest" class="signup-logo">

    <section class="about signup-card">
      <h1>Join Our Mailing List</h1>
      <p>Sign up to hear about Klez Fest Midwest concerts and events.</p>

      <div class="mailing-list-form">
        <div id="mc_embed_signup">
          <form action="https://klezfestmidwest.us13.list-manage.com/subscribe/post?u=78bee4bff34e07ac5d15fafb3&amp;id=4800d24a66&amp;f_id=00560de3f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate>
            <div id="mc_embed_signup_scroll">
              <div class="indicates-required"><span class="asterisk">*</span> indicates required</div>
              <div class="mc-field-group">
                <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
                <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required value="">
              </div>
              <div class="mc-field-group">
                <label for="mce-FNAME">First Name <span class="asterisk">*</span></label>
                <input type="text" name="FNAME" class="required text" id="mce-FNAME" required value="">
              </div>
              <div aria-hidden="true" style="position: absolute; left: -5000px;">
                <input type="text" name="b_78bee4bff34e07ac5d15fafb3_4800d24a66" tabindex="-1" value="">
              </div>
              <div class="clear">
                <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button btn-home" value="Subscribe">
              </div>
            </div>
          </form>
        </div>
        <div id="mce-responses" class="clear">
          <div class="response" id="mce-error-response" style="display: none;"></div>
          <div class="response" id="mce-success-response" style="display: none;"></div>
        </div>
      </div>
    </section>

    <p class="signup-footer"><a href="index.html">klezfestmidwest.org</a></p>
