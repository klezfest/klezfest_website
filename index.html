<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klez Fest Midwest</title>
  <style>
    :root {
      --maroon: #5c2430;
      --gold: #c9a24b;
      --ink: #2b2320;
      --paper: #fdfaf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      padding: 1.5rem;
    }
    main { max-width: 480px; }
    .banner {
      display: block;
      width: 100%;
      max-width: 335px;
      height: auto;
      margin: 0 auto 1.5rem;
    }
    .notice {
      background: #f2ead9;
      border: 1px solid #e4dccb;
      border-radius: 6px;
      padding: 2rem;
    }
    .notice p {
      line-height: 1.6;
      margin: 0;
    }
    .notice a {
      color: var(--maroon);
      font-weight: bold;
    }
    .nowrap {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/banner.jpg" alt="Klez Fest Midwest" class="banner">
    <div class="notice">
      <p>Klez Fest Midwest will take place in Madison, Wisconsin, <span class="nowrap">October 22&ndash;25, 2026!</span><br><br>We&rsquo;ll post updates and the schedule here. Please check back and follow us at <a href="https://www.facebook.com/KlezFestMidwest" target="_blank" rel="noopener noreferrer">facebook.com/KlezFestMidwest</a>.<br><br>We can&rsquo;t wait to see you in October!</p>
    </div>
  </main>
</body>
</html>
