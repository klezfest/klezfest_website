<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klez Fest Midwest</title>
  <style>
    :root {
      --maroon: #5c2430;
      --gold: #c9a24b;
      --ink: #2b2320;
      --paper: #fdfaf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      padding: 1.5rem;
    }
    main { max-width: 480px; }
    h1 {
      color: var(--maroon);
      font-size: 2.25rem;
      margin: 0 0 0.75rem;
    }
    p.tagline {
      font-size: 1.1rem;
      margin: 0 0 1.5rem;
    }
    p.notice {
      display: inline-block;
      background: var(--gold);
      color: var(--ink);
      font-weight: bold;
      font-size: 1.15rem;
      padding: 0.75rem 1.25rem;
      border-radius: 4px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Klez Fest Midwest</h1>
    <p class="tagline">October 22&ndash;25, 2026</p>
    <p class="notice">Check back soon!</p>
  </main>
</body>
</html>
